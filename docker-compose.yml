services:
  # 如果服务器有 Cloudflare Tunnel就可以解开注释配置
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   network_mode: host
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUD_FLARE_TUNNEL_TOKEN}

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gamefeedback
      POSTGRES_USER: gamefeedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamefeedback -d gamefeedback"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=gamefeedback;Username=gamefeedback;Password=${POSTGRES_PASSWORD}
      # Steam 配置（Publisher Web API Key / AppID / identity）不在环境变量里：按游戏存在数据库中，
      # 由管理员在「游戏」与「Steam 凭据」页面维护。
      # Data Protection key ring：加密 Steam 密钥用。这个卷必须备份——丢了它已存凭据就永久解不开。
      DataProtection__KeysPath: /app/keys
      Steam__DebugSkipTicketValidation: ${STEAM_DEBUG_SKIP:-false}
      Jwt__Issuer: ${JWT_ISSUER:-GameFeedback}
      Jwt__Audience: ${JWT_AUDIENCE:-GameFeedbackClient}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?请在 .env 中设置至少 32 字符的 JWT_SIGNING_KEY}
      Admin__SeedEmail: ${ADMIN_SEED_EMAIL:-admin@example.com}
      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD:?请在 .env 中设置 ADMIN_SEED_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:-127.0.0.1}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    volumes:
      - data-protection-keys:/app/keys
    ports:
      # 仅绑定本机回环：公网入口由 Cloudflare Tunnel / Nginx / Caddy 承担
      - "127.0.0.1:3000:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  data-protection-keys:
